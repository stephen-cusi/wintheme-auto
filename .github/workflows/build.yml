name: ci build

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.2beta），用于手动发布对应的 Release'
        required: false
        default: '0.2beta'

permissions:
  contents: write # release job 需要创建/更新 Release / 上传产物

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        shell: pwsh
        run: |
          # 设置 MSVC 编译环境。直接在 pwsh 里调 vcvarsall.bat（不用 node 动作，
          # 避免 ilammy/msvc-dev-cmd 的 Node20 弃用警告）。
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vsWhere)) {
            $vsWhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          $vsPath = & $vsWhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "未找到 Visual Studio 的 VC 工具" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          $vcArch = if ('${{ matrix.arch }}' -eq 'x64') { 'amd64' } else { 'arm64' }
          # 捕获 vcvarsall 导出的环境变量，写进当前 PowerShell 进程，供下方 cargo 使用
          cmd /c "call `"$vcvars`" $vcArch >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($matches[1])" -Value $matches[2] }
          }
          # GitHub runner 的 Git\usr\bin 里有一个 POSIX link.exe（coreutils link 命令）。
          # rustc 找链接器时可能解析到它而不是 MSVC 的 link.exe（arm64 交叉编译必踩），
          # 表现为 "link: extra operand ..."。从 PATH 剔除强制走 VS 链接器。
          $env:PATH = ($env:PATH.Split(';') | Where-Object { $_ -notlike '*\Git\usr\bin*' }) -join ';'
          cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/wintheme-auto.exe" `
            "target/${{ matrix.target }}/release/wintheme-auto-${{ matrix.arch }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wintheme-auto-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/wintheme-auto-${{ matrix.arch }}.exe
          if-no-files-found: error

  # 单一滚动发布：每次 push 到 main 都更新同一个 release（tag 固定为 rolling），
  # 替换 x64/ARM64 产物并把当前 commit 写进说明。
  release:
    name: Publish GitHub Release (rolling)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create / update rolling GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rolling
          name: WinTheme Auto (rolling)
          # v3 已在 tag 存在时自动更新该 release；overwrite_files 确保替换同名产物
          overwrite_files: true
          prerelease: true
          files: dist/*.exe
          body: |
            Rolling build from `main`.

            Commit: `${{ github.sha }}`
            ${{ github.event.head_commit.message }}

            Binaries: x64 and ARM64 (attached `.exe` files).

  # 版本化发布（按触发事件拆分，避免跨事件引用 inputs 导致 push 触发校验失败）：
  # - 推送 tag(如 0.2beta)：只用 github.* 上下文
  # - 手动 workflow_dispatch：只用 inputs.* 上下文
  release_version:
    name: Publish GitHub Release (tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-tag
          merge-multiple: true

      - name: Create / update tag GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # beta/rc 预览版；正式版本则作为正式版
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          overwrite_files: true
          files: dist-tag/*.exe
          body: |
            Release `${{ github.ref_name }}` (built by ci build).

            Commit: `${{ github.sha }}`

            Binaries: x64 and ARM64 (attached `.exe` files).

  release_manual:
    name: Publish GitHub Release (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist-manual
          merge-multiple: true

      - name: Create / update manual GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          # beta/rc 预览版；正式版本则作为正式版
          prerelease: ${{ contains(inputs.version, 'beta') || contains(inputs.version, 'rc') }}
          overwrite_files: true
          files: dist-manual/*.exe
          body: |
            Release `${{ inputs.version }}` (built by ci build).

            Commit: `${{ github.sha }}`

            Binaries: x64 and ARM64 (attached `.exe` files).
