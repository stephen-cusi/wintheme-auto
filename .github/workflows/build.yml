name: ci build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # release job 需要创建/更新 Release / 上传产物

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            msvc_arch: x64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            msvc_arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 配置 MSVC 链接环境。x64 预装在 runner 上；arm64 生成工具在 windows-latest
      # 镜像中已预装（GitHub 自 2024 年起提供），无需手动安装。
      # 若 arm64 链接报缺 ARM64 库，可改用 cargo-xwin 交叉编译方案。
      - name: Configure MSVC (${{ matrix.msvc_arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build release
        shell: pwsh
        run: |
          # GitHub runner 的 Git\usr\bin 里有一个 POSIX link.exe（coreutils link 命令）。
          # rustc 找链接器时可能解析到它而不是 MSVC 的 link.exe（arm64 交叉编译必踩），
          # 表现为 "link: extra operand ..."。从 PATH 剔除强制走 VS 链接器。
          # git 命令本身在 Git\cmd，不受影响。
          $env:PATH = ($env:PATH.Split(';') | Where-Object { $_ -notlike '*\Git\usr\bin*' }) -join ';'
          cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/wintheme-auto.exe" `
            "target/${{ matrix.target }}/release/wintheme-auto-${{ matrix.arch }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wintheme-auto-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/wintheme-auto-${{ matrix.arch }}.exe
          if-no-files-found: error

  # 单一滚动发布：每次 push 到 main 都更新同一个 release（tag 固定为 rolling），
  # 替换 x64/ARM64 产物并把当前 commit 写进说明。
  release:
    name: Publish GitHub Release (rolling)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create / update rolling GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rolling
          name: WinTheme Auto (rolling)
          # v3 已在 tag 存在时自动更新该 release；overwrite_files 确保替换同名产物
          overwrite_files: true
          prerelease: true
          files: dist/*.exe
          body: |
            Rolling build from `main`.

            Commit: `${{ github.sha }}`
            ${{ github.event.head_commit.message }}

            Binaries: x64 and ARM64 (attached `.exe` files).
