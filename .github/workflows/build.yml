name: ci build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # release job 需要创建/更新 Release / 上传产物

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        shell: pwsh
        run: |
          # 设置 MSVC 编译环境。直接在 pwsh 里调 vcvarsall.bat（不用 node 动作，
          # 避免 ilammy/msvc-dev-cmd 的 Node20 弃用警告）。
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vsWhere)) {
            $vsWhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          $vsPath = & $vsWhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "未找到 Visual Studio 的 VC 工具" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          $vcArch = if ('${{ matrix.arch }}' -eq 'x64') { 'amd64' } else { 'arm64' }
          # 捕获 vcvarsall 导出的环境变量，写进当前 PowerShell 进程，供下方 cargo 使用
          cmd /c "call `"$vcvars`" $vcArch >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Set-Item -Path "env:$($matches[1])" -Value $matches[2] }
          }
          # GitHub runner 的 Git\usr\bin 里有一个 POSIX link.exe（coreutils link 命令）。
          # rustc 找链接器时可能解析到它而不是 MSVC 的 link.exe（arm64 交叉编译必踩），
          # 表现为 "link: extra operand ..."。从 PATH 剔除强制走 VS 链接器。
          $env:PATH = ($env:PATH.Split(';') | Where-Object { $_ -notlike '*\Git\usr\bin*' }) -join ';'
          cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/wintheme-auto.exe" `
            "target/${{ matrix.target }}/release/wintheme-auto-${{ matrix.arch }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wintheme-auto-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/wintheme-auto-${{ matrix.arch }}.exe
          if-no-files-found: error

  # 单一滚动发布：每次 push 到 main 都更新同一个 release（tag 固定为 rolling），
  # 替换 x64/ARM64 产物并把当前 commit 写进说明。
  release:
    name: Publish GitHub Release (rolling)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Get short commit hash
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create / update rolling GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rolling
          name: WinTheme Auto (rolling)
          overwrite_files: true
          prerelease: true
          files: dist/*.exe
          body: |
            Rolling build from `main`.

            Commit: ${{ steps.sha.outputs.short }}

            Binaries: x64 and ARM64 (attached `.exe` files).
